[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Build the server part for Netlify instead of the default Cloudflare target
  NITRO_PRESET = "netlify"

# Photos are stored on Lovable's image storage; forward those requests there.
[[redirects]]
  from = "/__l5e/*"
  to = "https://k-beauty-clone.lovable.app/__l5e/:splat"
  status = 200
  force = true
